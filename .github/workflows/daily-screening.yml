name: Daily screening (cloud)

on:
  # v3 初期運用: 自動 schedule は無効（手動 workflow_dispatch のみ）
  # schedule:
  #   - cron: "0 0 * * 1-5"
  #   - cron: "0 1 * * 1-5"
  #   - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "実行範囲"
        required: true
        default: full
        type: choice
        options:
          - full
          - analyze
          - publish
      config_profile:
        description: "設定 (lo のみ)"
        required: true
        default: lo
        type: choice
        options:
          - lo

permissions:
  contents: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/kaburadar.db
          key: kaburadar-db-v3

      - name: Verify database
        run: |
          test -f data/kaburadar.db
          size=$(stat -c%s data/kaburadar.db)
          echo "kaburadar.db size=${size} bytes"
          if [ "$size" -lt 100000000 ]; then
            echo "::error::DB missing or too small (${size} bytes). DB is local-only; seed Actions cache or run locally."
            exit 1
          fi

      - name: Log schedule timing (verification)
        if: github.event_name == 'schedule'
        env:
          TZ: Asia/Tokyo
        run: |
          echo "=== schedule verification ==="
          echo "github.event.schedule=${{ github.event.schedule }}"
          echo "run_started_jst=$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "run_started_utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Select screening config
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then JOB="full"; fi
          echo "KABURADAR_JOB=$JOB" >> "$GITHUB_ENV"
          PROFILE="${{ github.event.inputs.config_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="lo"; fi
          echo "KABURADAR_CONFIG=config/config_lo.ini" >> "$GITHUB_ENV"
          echo "Using config_lo.ini (LO / RSI+RCI)"

      - name: Update prices (5 days)
        if: env.KABURADAR_JOB == 'full'
        env:
          PYTHONPATH: src
        run: python src/kaburadar3/cli/update_prices.py --menu 6

      - name: Analyze all symbols
        if: env.KABURADAR_JOB == 'full' || env.KABURADAR_JOB == 'analyze'
        env:
          PYTHONPATH: src
          KABURADAR_CONFIG: ${{ env.KABURADAR_CONFIG }}
        run: python src/kaburadar3/cli/analyze.py

      - name: Build GitHub Pages JSON
        if: env.KABURADAR_JOB == 'full' || env.KABURADAR_JOB == 'publish'
        env:
          PYTHONPATH: src
          TZ: Asia/Tokyo
          KABURADAR_REFRESH_TIMESTAMP: "1"
          KABURADAR_CONFIG: ${{ env.KABURADAR_CONFIG }}
          KABURADAR_PAGES_URL: https://lalakuma.github.io/KabuRadar3
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/kaburadar3/cli/publish.py

      - name: Deploy GitHub Pages
        if: env.KABURADAR_JOB == 'full' || env.KABURADAR_JOB == 'publish'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true

      # LINE 通知はローカル本番のみ（screening_lo.bat）。クラウドからは送らない。

      - name: Commit results
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/special_state.json data/quality_cache.json docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH=$(python -c "import sys; sys.path.insert(0,'src'); from kaburadar3.settings.git_publish import resolve_publish_branch; print(resolve_publish_branch())")
          git commit -m "クラウド解析結果を更新 (Actions)"
          git push origin "HEAD:${BRANCH}"
